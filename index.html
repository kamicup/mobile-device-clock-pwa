<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clock">
    <title>Clock</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-background" aria-hidden="true"></div>
    <main class="shell" aria-live="polite">
      <section class="date-panel" aria-label="現在の年月日と曜日">
        <div id="local-date" class="local-date">----</div>
        <div id="local-weekday" class="local-weekday">----</div>
      </section>

      <section class="time-panel" aria-label="現在の時刻">
        <div id="local-time" class="local-time">--:--:--</div>
      </section>

      <section class="calendar-panel" aria-label="今月のカレンダー">
        <div class="calendar-head">
          <div id="calendar-title" class="calendar-title">----</div>
        </div>
        <div id="calendar-weekdays" class="calendar-weekdays"></div>
        <div id="calendar-grid" class="calendar-grid"></div>
      </section>

      <section class="gmt-panel" aria-label="現在のGMT時刻">
        <div class="gmt-label">GMT</div>
        <div class="gmt-value">
          <div id="gmt-date" class="gmt-date">----</div>
          <div id="gmt-time" class="gmt-time">--:--:--</div>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
